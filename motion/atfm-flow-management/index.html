<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>ATFM 兩種流量管理功能 v5</title>
    <link rel="stylesheet" href="assets/atfm.css" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/vendor/DrawSVGPlugin.min.js"></script>
    <script src="assets/vendor/CustomEase.min.js"></script>
    <script src="assets/vendor/MorphSVGPlugin.min.js"></script>
    <script>
      gsap.registerPlugin(DrawSVGPlugin, CustomEase, MorphSVGPlugin);
    </script>
    <script src="assets/map-data.js"></script>
    <script src="assets/atfm-kit.js"></script>
    <script src="assets/atfm-world.js"></script>
    <style>
      @font-face {
        font-family: "ATFM Sans";
        src: url("assets/fonts/NotoSansTC.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #f3ece5; }
      #root {
        position: relative; width: 100%; height: 100%; overflow: hidden;
        background: #f3ece5; font-family: "ATFM Sans", sans-serif;
      }
      #bg-vignette {
        position: absolute; inset: 0; z-index: 0;
        background:
          radial-gradient(120% 90% at 50% 42%, rgba(243, 236, 229, 0) 55%, rgba(214, 202, 188, 0.38) 100%),
          linear-gradient(180deg, #f5efe8 0%, #f3ece5 60%, #f1e9e1 100%);
      }
      .scene { position: absolute; inset: 0; z-index: 2; }
      #grain {
        position: absolute; inset: 0; z-index: 40; pointer-events: none;
        background-image: url("assets/img/grain.png"); background-size: 512px 512px;
        opacity: 0.06; mix-blend-mode: multiply;
      }
      /* ---------- header ---------- */
      #hdr { position: absolute; left: 110px; top: 60px; width: 1300px; height: 140px; z-index: 30; }
      .hdr-entry { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
      .hdr-kicker {
        position: absolute; left: 0; top: 14px; height: 30px; display: flex; align-items: center; gap: 14px;
        font-size: 22px; font-weight: 500; color: #6e6a64; letter-spacing: 0.22em; white-space: nowrap;
      }
      .hdr-kicker .hdr-tick { display: block; width: 26px; height: 3px; border-radius: 2px; background: #1f6b62; }
      .hdr-title {
        position: absolute; left: 0; top: 52px; height: 80px; display: flex; overflow: hidden;
        font-size: 54px; font-weight: 700; line-height: 80px; color: #1f6b62; letter-spacing: 0.03em; white-space: nowrap;
      }
      .hdr-title .ch { display: block; position: relative; }
      .hdr-title .sp { display: block; width: 0.5em; }
      #foot {
        position: absolute; right: 110px; top: 876px; z-index: 30;
        font-size: 20px; font-weight: 500; color: #6e6a64; letter-spacing: 0.06em; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="49" data-width="1920" data-height="1080">
      <div id="bg-vignette"></div>

      <div id="c1-map-intro" class="scene clip" data-composition-id="c1-map-intro" data-composition-src="compositions/c1-map-intro.html"
        data-start="0" data-duration="8.2" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="c2-airport" class="scene clip" data-composition-id="c2-airport" data-composition-src="compositions/c2-airport.html"
        data-start="7.4" data-duration="16.9" data-track-index="2" data-width="1920" data-height="1080"></div>
      <div id="c3-border" class="scene clip" data-composition-id="c3-border" data-composition-src="compositions/c3-border.html"
        data-start="23.6" data-duration="14.1" data-track-index="3" data-width="1920" data-height="1080"></div>
      <div id="c4-relay" class="scene clip" data-composition-id="c4-relay" data-composition-src="compositions/c4-relay.html"
        data-start="37.3" data-duration="4.0" data-track-index="4" data-width="1920" data-height="1080"></div>
      <div id="c5-map-outro" class="scene clip" data-composition-id="c5-map-outro" data-composition-src="compositions/c5-map-outro.html"
        data-start="40.7" data-duration="8.3" data-track-index="5" data-width="1920" data-height="1080"></div>

      <div id="hdr"></div>
      <div id="foot">航路、時段與機場配置為解說示意</div>
      <div id="grain"></div>
    </div>

    <script>
      (function () {
        var K = window.ATFM_KIT;
        // Header schedule — mirrors DESIGN.md §7. [time, kicker, title]
        var HDR = [
          [0.0, "ATFM　飛航流量管理", "兩種流量管理功能"],
          [5.3, "ATFM　飛航流量管理", "全方位守護臺灣的天空"],
          [7.57, "01　AIRPORT FLOW MANAGEMENT", "第一　機場端流量管理"],
          [10.91, "01　機場端流量管理", "目的地受限，到場容量降低"],
          [18.65, "01　機場端流量管理", "自動重新派發起飛時間"],
          [23.91, "02　BORDER POINT FLOW MANAGEMENT", "第二　邊境點流量管理"],
          [26.96, "02　邊境點流量管理", "邊境點受限，通過時段縮減"],
          [30.08, "02　邊境點流量管理", "自動調控過境航班起飛時間"],
          [34.75, "02　邊境點流量管理", "達成跨區作業整合"],
          [37.77, "跨區協作　CROSS-REGION", "超越國界的接力賽"],
          [40.97, "01 ＋ 02", "兩項功能相互配合"],
          [43.73, "臺北飛航情報區　TAIPEI FIR", "讓天空運作更加順暢"],
        ];
        var hdr = document.getElementById("hdr");
        var tl = gsap.timeline({ paused: true });
        var prev = null;
        HDR.forEach(function (e, i) {
          var t = e[0];
          var entry = K.el("div", { class: "hdr-entry" });
          var kick = K.el("div", { class: "hdr-kicker" }, [K.el("span", { class: "hdr-tick" }), K.el("span", { text: e[1] })]);
          var title = K.el("div", { class: "hdr-title" });
          var chars = [];
          e[2].split("").forEach(function (c) {
            var n = c === "　" ? K.el("span", { class: "sp" }) : K.el("span", { class: "ch", text: c });
            title.appendChild(n);
            if (c !== "　") chars.push(n);
          });
          entry.appendChild(kick);
          entry.appendChild(title);
          hdr.appendChild(entry);
          var sameKicker = prev && prev.kicker === e[1];
          // incoming
          var tin = i === 0 ? 0.35 : t + 0.12;
          tl.fromTo(chars, { yPercent: 108, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.75, ease: "power3.out", stagger: 0.032 }, tin);
          if (sameKicker) {
            gsap.set(kick, { opacity: 0 });
          } else {
            tl.fromTo(kick, { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, tin - 0.05);
            tl.fromTo(kick.firstChild, { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "expo.out" }, tin);
          }
          // outgoing previous
          if (prev) {
            tl.to(prev.chars, { yPercent: -108, opacity: 0, duration: 0.38, ease: "power2.in", stagger: 0.012 }, t - 0.3);
            if (!sameKicker) tl.to(prev.kick, { opacity: 0, x: 10, duration: 0.3, ease: "power2.in" }, t - 0.25);
            else {
              // carry the visible kicker across: hide the old one exactly when the new entry's (hidden) one would show
              tl.set(prev.kick, { opacity: 0 }, t + 0.06);
              tl.set(kick, { opacity: 1, x: 0 }, t + 0.06);
              tl.set(kick.firstChild, { scaleX: 1 }, t + 0.06);
            }
          }
          prev = { chars: chars, kick: kick, kicker: e[1] };
        });
        tl.fromTo("#foot", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0.6);
        tl.set({}, {}, 49);
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
