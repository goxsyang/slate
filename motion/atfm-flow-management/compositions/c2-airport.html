<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "ATFM Sans"; src: url("assets/fonts/NotoSansTC.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        @font-face { font-family: "ATFM Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
        #c2-root { position: absolute; inset: 0; overflow: hidden; font-family: "ATFM Sans", sans-serif; }
        #c2-root .c2-layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #c2-root #c2-stage { z-index: 1; }
        #c2-root #c2-ui { z-index: 3; }
        #c2-root .c2-box { position: absolute; display: block; }
        #c2-root svg.c2-svg { position: absolute; left: 0; top: 0; display: block; overflow: visible; }
        /* terra glow behind the constrained destination (block 1410–1810 × 630–846) */
        #c2-root .c2-glow {
          left: 1370px; top: 586px; width: 440px; height: 270px;
          background: radial-gradient(closest-side, rgba(178, 81, 53, 0.18), rgba(178, 81, 53, 0));
        }
        /* airport captions float BESIDE the blocks (§0C): box 790–842, ink ≈ 797–835 */
        #c2-root .c2-lbl { top: 790px; height: 52px; line-height: 52px; }
        #c2-root .c2-lbl-r { right: 540px; text-align: right; } /* 目的地機場: right edge at x 1380 */
        #c2-root .c2-uline { left: 1220px; top: 846px; width: 160px; height: 3px; border-radius: 2px; background: #b25135; }
        /* cause chips: 24 px side padding so 天氣 (121) + 跑道維護 (195) both fit inside x 1480–1810 */
        #c2-root .c2-cause { padding: 0 24px; }
        /* swap boxes (DEP chip) are sized by an invisible copy of their longest label; the visible labels are stacked spans */
        #c2-root .c2-sizer { visibility: hidden; white-space: nowrap; }
        #c2-root .c2-swap { position: absolute; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
        /* DEP chip = one opaque box (x 110–390, y 500–576); SIG2 ends 36 px inside its top edge. It clears the panel (x ≥ 460)
           by 70 px and sits ≥ 30 px above B's time tag at LU (top 603). */
        #c2-root .c2-chipwrap { left: 110px; top: 500px; }
        /* the ✓ in a done flight chip ("A ✓") is Sans — the mono face has no check glyph and falls back to a radical sign (P5) */
        #c2-root .ks-chip .c2-ck { font-family: "ATFM Sans", sans-serif; margin-left: 8px; } /* the chip is a flex row: the space collapses, so the gap is a margin */
      </style>
      <div id="c2-root" data-composition-id="c2-airport" data-width="1920" data-height="1080" data-duration="16.9"></div>
      <script>
        (function () {
          var K = window.ATFM_KIT;
          var root = document.getElementById("c2-root");
          var tl = gsap.timeline({ paused: true });

          // ---------- constants ----------
          var W0 = 7.4; // window start on the master timeline
          function G(t) { return Math.round((t - W0) * 10000) / 10000; } // global → local
          var TEAL = "#1F6B62", TEAL2 = "#3E8C80", TSOFT = "#A9C7BD", TERRA = "#B25135", INKS = "#6E6A64", CARD = "#FBF7F2";
          // the system panel's own colours (DESIGN §5b) — used only on the panel
          var SYS = { pink: "#E6399B", grey: "#6B7482", mint: "#9FE0C9", terra: "#F08A6B" };
          var LED_GLOW = "0 0 0 5px rgba(159,224,201,0.18)";
          var Q = 0.55; // iso ground squash (K.AIRPORT.squash)
          var SANS = '"ATFM Sans", sans-serif', MONO = '"ATFM Mono", "ATFM Sans", monospace';

          // ---------- airport geometry (§0C re-fit: both blocks w 400 → k = 0.25, top y 630, bottoms 846) ----------
          // DEP box 110–510 × 630–846; DST (mirrored) 1410–1810 × 630–846. Every point below is K.airportPt-derived:
          //   DEP runway  R(u)  = (137.5 + 305u, 713.75 − 67.75u) (−12.5°), taxiway H(u) = R(u) + (4.33, 19.5)
          //   DST runway  R′(u) = (1477.5 + 305u, 646 + 67.75u) (landing direction, +12.5°)
          //   LU = R(0.54) (302.2, 677.17) · LO = LU + 96 px (395.92, 656.39) · E = R(1) (442.5, 646)
          //   Q1 = H(0.38) (257.73, 707.51) · Q2 = H(0.21) (205.88, 719.02) · Q3 = H(0.04) (154.02, 730.54)  (53 px pitch;
          //   LU–Q1 = 53.9 px so two r 23 letter tags never touch; Q3 stays on the taxiway pavement, which starts at x ≈ 134)
          //   H′ = R′(0) (1477.5, 646) · TD = R′(0.18) (1532.4, 658.2) · RO = R′(0.46) (1617.8, 677.17)
          // The arc is a tangent-matched cubic (handles 236 px at ±12.5°): apex y 607.7 (≥ 606), so a plane's wingtip
          // (len 44 → ±20) stays ≥ 20 px below the panel bottom (568) before the stage drift pushes it further down.
          var AP_W = 400, AP_H = 216, AP_Y = 630, DEP_X = 110, DST_X = 1410;
          var PT = { LU: [302.2, 677.17], LO: [395.92, 656.39], E: [442.5, 646], H: [1477.5, 646], TD: [1532.4, 658.2], RO: [1617.8, 677.17] };
          function P2(p) { return p[0] + " " + p[1]; }
          [["LU", 0.54], ["E", 1]].forEach(function (x) { // guard: the table above must agree with the kit's asset geometry
            var r = K.airportPt(DEP_X, AP_Y, AP_W, 110 + 1220 * x[1], 335 - 271 * x[1]);
            if (Math.abs(r[0] - PT[x[0]][0]) > 0.1 || Math.abs(r[1] - PT[x[0]][1]) > 0.1) { if (window.console) console.warn("[c2] airport point " + x[0] + " drifted", r); }
          });

          // ---------- layers ----------
          var stage = K.el("div", { id: "c2-stage", class: "c2-layer" });
          var ui = K.el("div", { id: "c2-ui", class: "c2-layer" });
          root.appendChild(stage);
          root.appendChild(ui);

          // invisible copy of a swap box's longest label: sizes the box at any type scale
          function sizer(text) { var e = K.el("span", { class: "c2-sizer", text: text }); e.setAttribute("aria-hidden", "true"); return e; }

          // ===== WORLD LAYER (drifts) =====
          // 1 · terra glow behind the destination
          var glow = K.el("div", { class: "c2-box c2-glow" });
          stage.appendChild(glow);
          // 2 · departure airport
          var dep = K.el("div", { class: "c2-box", style: { left: DEP_X + "px", top: AP_Y + "px", width: AP_W + "px", height: AP_H + "px" } }, [K.airport({ x: 0, y: 0, w: AP_W })]);
          stage.appendChild(dep);
          // 3 · destination airport (mirrored raster; entrance scale lives on the wrapper)
          var dstAp = K.airport({ x: 0, y: 0, w: AP_W });
          var dst = K.el("div", { class: "c2-box", style: { left: DST_X + "px", top: AP_Y + "px", width: AP_W + "px", height: AP_H + "px" } }, [dstAp]);
          stage.appendChild(dst);
          gsap.set(dstAp.querySelector("img"), { scaleX: -1 });

          // 4 · FX svg: hidden flight paths, route, hatch, cones, planes
          var fx = K.s("svg", { class: "c2-svg", width: "1920", height: "1080", viewBox: "0 0 1920 1080" });
          stage.appendChild(fx);
          var fxDefs = K.s("defs");
          fx.appendChild(fxDefs);
          fxDefs.innerHTML =
            '<pattern id="c2-hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">' +
            '<rect width="8" height="8" fill="#F2DDD3"/><rect width="3.2" height="8" fill="#B25135"/></pattern>';
          function hidden(d) { var p = K.s("path", { d: d, fill: "none", stroke: "none" }); fx.appendChild(p); return p; }
          var ARC_D = "C672.91 594.92 1247.09 594.92 " + P2(PT.H);
          var FLT2 = hidden("M" + P2(PT.LU) + "L" + P2(PT.LO) + "L" + P2(PT.E) + ARC_D + "L" + P2(PT.TD) + "L" + P2(PT.RO));
          // exit: turn-in to the runway edge, then a G1-continuous straight across the grass strip to the parallel
          // taxiway centreline (y 706.8 at x 1659.5)
          var TURN2 = hidden("M1617.8 677.17C1624.96 678.75 1632.08 683.81 1636.67 687.66L1659.47 706.8");
          var MERGE = hidden("M257.73 707.5C274.32 703.83 285.6 680.84 302.2 677.17"); // Q1 → LU (17 px handles at ±12.5°)
          var TAXI21 = hidden("M205.88 719.02L257.73 707.5"); // Q2 → Q1
          var TAXI32 = hidden("M154.02 730.54L205.88 719.02"); // Q3 → Q2

          // FLT2 breakpoints (asserted against the derived reference ±0.002; L = 1326.9)
          var F = {
            LO: K.fracAt(FLT2, PT.LO[0], PT.LO[1]),
            E: K.fracAt(FLT2, PT.E[0], PT.E[1]),
            H: K.fracAt(FLT2, PT.H[0], PT.H[1]),
            TD: K.fracAt(FLT2, PT.TD[0], PT.TD[1]),
          };
          var REF = { LO: 0.0724, E: 0.1083, H: 0.8917, TD: 0.9341 };
          Object.keys(REF).forEach(function (k) {
            if (Math.abs(F[k] - REF[k]) > 0.002) { if (window.console) console.warn("[c2] FLT2 frac " + k + " = " + F[k] + " (ref " + REF[k] + ")"); F[k] = REF[k]; }
          });

          var gR = K.s("g", { class: "c2-gr" }); // right group (fades right at the handoff)
          fx.appendChild(gR);
          var route2 = K.s("path", { d: "M" + P2(PT.E) + ARC_D, fill: "none", stroke: TSOFT, "stroke-width": "4", "stroke-linecap": "round" });
          var route2G = K.s("g", { class: "c2-route" }); // slides in with DEP so the arc's start stays on the runway end
          route2G.appendChild(route2);
          gR.appendChild(route2G);
          // runway-works hatch on the DST runway, R′(0.60)–R′(0.94): N2's turn-off (RO = R′(0.46)) stays 44 px clear of its start
          var hatchO = K.s("g", { transform: "translate(1660.5 686.65) rotate(12.5)" });
          var hatch = K.s("g");
          // 16 px tall on the 11 px painted runway (2.5 px over each edge, like real works barriers) so it reads at 1080p
          hatch.appendChild(K.s("rect", { x: "0", y: "-8", width: "106.2", height: "16", rx: "3", fill: "url(#c2-hatch)", stroke: TERRA, "stroke-width": "2" }));
          hatchO.appendChild(hatch);
          gR.appendChild(hatchO);
          // cones (h 19 → w 14.8; bottom-centres on R′(0.64/0.74/0.84))
          var CONE_H = 19, CONE_W = CONE_H * 0.78;
          var cones = [[1672.7, 689.36], [1703.2, 696.14], [1733.7, 702.91]].map(function (p) {
            var c = K.cones({ n: 1, h: CONE_H });
            c.setAttribute("x", String(Math.round((p[0] - CONE_W / 2) * 10) / 10));
            c.setAttribute("y", String(Math.round((p[1] - CONE_H) * 10) / 10));
            gR.appendChild(c);
            return c.__cones[0];
          });

          // planes — each in its own wrapper <g> (opacity / slide); the plane <g> itself is driven only by `along`
          var gP = K.s("g", { class: "c2-planes" });
          gR.appendChild(gP);
          var TT_DY = -52; // time tag centre above the plane (box −74…−30; ground wingtip ≈ ±11). At E (y 646) the box top is 572 > 568
          function mkPlane(letter, time, dx, dy) {
            var w = K.s("g", { class: "c2-pw" });
            var pl = K.plane({ len: 44, alt: 0, squash: Q });
            w.appendChild(pl);
            gP.appendChild(w);
            var o = { w: w, pl: pl };
            if (!letter) return o;
            // hold ring (under the body), gated so it is invisible until its first pulse;
            // squashed onto the iso ground plane (static attribute — GSAP only tweens the gate's opacity)
            o.ringGate = K.s("g", { transform: "scale(1 " + Q + ")" });
            o.ring = K.s("circle", { r: "24", fill: "none", stroke: TERRA, "stroke-width": "2.5", "vector-effect": "non-scaling-stroke" });
            o.ringGate.appendChild(o.ring);
            pl.insertBefore(o.ringGate, pl.__body);
            // letter tag (+40): r 23, 30/700
            o.lt = K.s("g", { transform: "translate(0 40)" });
            o.ltC = K.s("circle", { r: "23", fill: CARD, stroke: INKS, "stroke-width": "2.5" });
            o.ltT = K.s("text", { x: "0", y: "1", "text-anchor": "middle", "dominant-baseline": "central", fill: INKS, style: { fontFamily: SANS, fontSize: "30px", fontWeight: "700" }, text: letter });
            o.lt.appendChild(o.ltC);
            o.lt.appendChild(o.ltT);
            pl.appendChild(o.lt);
            // time tag (112 × 44, mono 30/600), popped on dispatch. `dx`/`dy` park it off-centre while the plane waits
            // beside a neighbour (C at Q1 next to B at LU); a tween on o.tt re-centres it later.
            if (time) {
              var tto = K.s("g", { transform: "translate(" + (dx || 0) + " " + (TT_DY + (dy || 0)) + ")" });
              o.tt = K.s("g");
              o.tt.appendChild(K.s("rect", { x: "-56", y: "-22", width: "112", height: "44", rx: "10", fill: CARD, stroke: TSOFT, "stroke-width": "2" }));
              o.tt.appendChild(K.s("text", { x: "0", y: "1", "text-anchor": "middle", "dominant-baseline": "central", fill: TEAL, style: { fontFamily: MONO, fontSize: "30px", fontWeight: "600" }, text: time }));
              tto.appendChild(o.tt);
              pl.appendChild(tto);
            }
            return o;
          }
          // C's tag parks left of centre at Q1: box x 126.7–238.7 (7 px clear of B's tag at LU, x ≥ 246) and y 637.5–681.5
          // (15 px above C's own wing line at 696.5). The stage drift (scale 1.013, x −5 while it is parked, 19.94–20.45)
          // carries its left edge to x ≈ 110.5, so it stays inside the 110 margin.
          var C_TT_DX = -75, C_TT_DY = 4;
          var N1 = mkPlane(), N2 = mkPlane(), A = mkPlane("A"), B = mkPlane("B", "10:10"), C = mkPlane("C", "10:20", C_TT_DX, C_TT_DY);
          gsap.set([A.ringGate, B.ringGate, C.ringGate], { opacity: 0 }); // hold rings stay hidden until their pulse

          // 5 · INLINK (world layer, under the cloud): from the weather over the DST runway into the panel's right edge.
          // Its start hides under the cloud raster and its end 32 px inside the panel (x 1428 < 1460), so the stage drift
          // (≤ 6 px here) can never expose either end; the panel (UI layer) covers the arriving terra packet.
          var lkIn = K.s("svg", { class: "c2-svg", width: "1920", height: "1080", viewBox: "0 0 1920 1080" });
          stage.appendChild(lkIn);
          function link(d) { return K.s("path", { d: d, fill: "none", stroke: TEAL2, "stroke-width": "3", "stroke-dasharray": "10 12", "stroke-linecap": "round" }); }
          function packet(col) { return K.s("circle", { cx: "0", cy: "0", r: "7", fill: col, stroke: CARD, "stroke-width": "2" }); }
          var inlink = link(K.smooth([[1636, 606], [1560, 598], [1490, 560], [1428, 512]]));
          var pkIn = packet(TERRA);
          lkIn.appendChild(inlink);
          lkIn.appendChild(pkIn);

          // 6 · rain (inside its own right-group wrapper)
          var rainWrap = K.el("div", { class: "c2-layer" });
          stage.appendChild(rainWrap);
          var rainSvg = K.s("svg", { class: "c2-svg", width: "1920", height: "1080", viewBox: "0 0 1920 1080" });
          rainWrap.appendChild(rainSvg);

          // 7 · cloud over the DST runway (1580–1760 × 560–654): right of the touchdown zone, so landing planes
          // (TD x 1532, wing top ≥ 653 by x 1580) never pass under it; the rain falls from it onto the runway and hatch
          var cloudWrap = K.el("div", { class: "c2-box", style: { left: "1580px", top: "560px", width: "180px", height: "94px" } });
          var cloud = K.img({ src: K.PROPS.cloud.src, x: 0, y: 0, w: 180 });
          cloudWrap.appendChild(cloud);
          stage.appendChild(cloudWrap);

          // 8 · labels beside the airports (§0C): 起飛機場 right of DEP (x 540), 目的地機場 left of DST (right edge 1380)
          var depLabel = K.el("div", { class: "k-label c2-lbl", text: "起飛機場", style: { left: "540px" } });
          var dstLabel = K.el("div", { class: "k-label c2-lbl c2-lbl-r", text: "目的地機場" });
          var uline = K.el("div", { class: "c2-box c2-uline" });
          stage.appendChild(depLabel);
          stage.appendChild(dstLabel);
          stage.appendChild(uline);

          // ===== UI LAYER (never drifts) =====
          // 1 · dispatch link SIG2: panel left edge → DEP chip. Only 70 px separate the chip (right edge 390) and the panel (460),
          //     so a straight link would show ≈ 0.15 s of packet travel. It leaves the panel higher instead (36 px inside at
          //     (496, 426), beside the nav column) and sweeps down-left into the chip's TOP edge, ending 36 px inside it at
          //     (284, 536): ≈ 185 px visible, above everything that moves (B's / C's time tags stay at y ≥ 582).
          var lk = K.s("svg", { class: "c2-svg", width: "1920", height: "1080", viewBox: "0 0 1920 1080" });
          ui.appendChild(lk);
          var gSig = K.s("g");
          var sig2 = link(K.smooth([[496, 426], [416, 440], [330, 470], [284, 536]]));
          var pkSig = packet(TEAL2);
          gSig.appendChild(sig2);
          gSig.appendChild(pkSig);
          lk.appendChild(gSig);

          // 2 · the real-system panel (STORYBOARD §0C): AIRPORT view, badge RCTP, x 460–1460, y 228–568
          // Ruler: a 37-minute window (ticks 10:00 05 … 35) — on a 60-minute ruler 10 min is only 114 px, so the two
          // CTOT chips "B 10:10" / "C 10:20" (154 px each) would overprint; here 10 min = 185 px (31 px apart), the grey
          // "A ✓" chip (82 px) clears B at 05 by 11 px, and N2 at 35 (x 695–759) stays inside the 778 px lane.
          // Clock: the panel is up from 8.40 while A (10:00 on the strip) is still on the ground until 15.13, so it reads
          // 10:00 (not §0C's 10:01, inherited from the 18.76 entrance) and ticks to 10:01 at 18.63, just before the
          // count that §0C specifies takes over at 18.76 (601.43 → 633.93: 10:10 at 19.95, 10:20 at 21.35).
          var P = K.sysPanel({
            x: 460, y: 228, w: 1000, h: 340, active: "AIRPORT", badge: "RCTP", clock: "10:00",
            hours: [["0900", 0.9], ["1000", 0.8], ["1100", 0.95], ["1200", 0.7], ["1300", 0.75], ["1400", 0.6]].map(function (h) { return { h: h[0], aar: 25, fill: h[1], state: "normal" }; }),
            ruler: { start: 0, minutes: 37, step: 5, label: "10" },
            // all three flights start on time (blue); B and C turn pink (regulated) when the capacity drops at 15.85.
            // N2 at 10:35 is later traffic, so it is blue (planned) — §0C's grey would mark a flight 34 minutes ahead of the clock as done
            flights: [{ id: "A", min: 0, tone: "blue" }, { id: "B", min: 5, tone: "blue" }, { id: "C", min: 10, tone: "blue" }, { id: "N2", min: 35, tone: "blue" }],
          });
          Object.keys(P.pill.states).forEach(function (k) { P.pill.states[k].setAttribute("data-layout-allow-overlap", ""); }); // stacked, crossfaded states
          var chA = P.chips[0].el, chB = P.chips[1].el, chC = P.chips[2].el;
          var led = P.title.firstChild;
          ui.appendChild(P.el);

          // 3 · cause chips — right of the panel (x 1480–1810, y 420–560), in pop order: 天氣 upper-left, 跑道維護 lower-right
          var chipWx = K.chip("天氣", { x: 1480, y: 420, warn: true });
          var chipRw = K.chip("跑道維護", { x: 1612, y: 470, warn: true }); // bottom 546, 14 px above the cloud (top 560)
          chipWx.classList.add("c2-cause");
          chipRw.classList.add("c2-cause");
          ui.appendChild(chipWx);
          ui.appendChild(chipRw);
          // 4 · DEP chip stack at (110, 500): one opaque box (terra-soft → mint) that keeps SIG2's end covered; only the text swaps
          var chipWrap = K.el("div", { class: "k-chip is-warn c2-chipwrap" }, [sizer("已接收新時間")]);
          var chipHold = K.el("span", { class: "c2-swap", text: "地面等待", style: { color: TERRA } });
          var chipNew = K.el("span", { class: "c2-swap", text: "已接收新時間", style: { color: TEAL } });
          chipWrap.appendChild(chipHold);
          chipWrap.appendChild(chipNew);
          gsap.set(chipNew, { opacity: 0 });
          [chipHold, chipNew].forEach(function (e) { e.setAttribute("data-layout-allow-overlap", ""); }); // stacked swap texts
          ui.appendChild(chipWrap);

          // ================= TIMELINE (local times via G(global)) =================
          // ambient: one continuous stage drift for the whole window (1.015 / −6 keeps the DST block's shadow above y 860)
          tl.fromTo(stage, { scale: 1, x: 0, transformOrigin: "960px 560px" }, { scale: 1.015, x: -6, duration: 16.9, ease: "sine.inOut" }, 0);

          // --- VO3: catch the zoom-through ---
          // c1's dive lands RCTP on (1500, 648); that point is on the DST runway (R′ ≈ 0.07), so the block grows out of it
          tl.fromTo(dst, { opacity: 0, scale: 0.86, transformOrigin: "90px 18px" }, { opacity: 1, scale: 1, duration: 0.8, ease: "power3.out" }, G(7.70));
          K.draw(tl, route2, G(7.70), 0.9, "expo.out");
          // DEP rises with ROUTE2 (both 7.70) so the arc never starts drawing over empty cream
          tl.fromTo(dep, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.8, ease: "power3.out" }, G(7.70));
          // ROUTE2 rides the same slide, so its start stays on the DEP runway end; the expo.out draw front only
          // reaches the DST end after ≈ 8.3, when the slide offset is < 1 px
          tl.fromTo(route2G, { x: -40 }, { x: 0, duration: 0.8, ease: "power3.out" }, G(7.70));
          [N2, A, B, C].forEach(function (p) {
            tl.fromTo(p.w, { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, G(7.80));
            tl.fromTo(p.w, { x: -40 }, { x: 0, duration: 0.8, ease: "power3.out" }, G(7.70)); // rides in registered with its airport
          });
          tl.fromTo(N1.w, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, G(7.75));
          K.inUp(tl, depLabel, G(8.0), { y: 12, dur: 0.6 });
          K.inUp(tl, dstLabel, G(8.1), { y: 12, dur: 0.6 });
          // the system panel is on screen from 8.40 in S0 監控中 (where the slot card used to appear)
          K.inUp(tl, P.el, G(8.4), { y: 16, dur: 0.7 });

          // --- VO4: destination constrained ---
          tl.to(dstLabel, { color: TERRA, duration: 0.4, ease: "power2.inOut" }, G(11.05));
          tl.fromTo(uline, { scaleX: 0, transformOrigin: "50% 50%" }, { scaleX: 1, duration: 0.5, ease: "expo.out" }, G(11.05));
          tl.fromTo(glow, { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, G(11.05));
          // 「天氣」
          tl.fromTo(cloud, { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.9, ease: "power3.out" }, G(12.85));
          K.pop(tl, chipWx, G(12.9), { dur: 0.55, ease: "back.out(1.5)" });
          K.rain(tl, rainSvg, { id: "c2-rain", x: 1600, y: 648, w: 140, h: 76, n: 12, t0: G(12.95), t1: G(24.25) });
          // 「跑道」
          tl.fromTo(hatch, { scaleX: 0, opacity: 0, transformOrigin: "0% 50%" }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, G(13.65));
          K.pop(tl, chipRw, G(13.7), { dur: 0.55, ease: "back.out(1.5)" });
          cones.forEach(function (c, i) {
            tl.fromTo(c, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, G(13.8) + 0.08 * i);
          });
          tl.to(cloud, { x: -6, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, G(13.8)); // ends 22.60 at x 0
          K.out(tl, chipWx, G(15.7), { dur: 0.35 });
          K.out(tl, chipRw, G(15.75), { dur: 0.35 });

          // --- VO5 「降低」: hours 1000 and 1100 drop to AAR 23 (pink, red ATFM); B and C become regulated (pink) and hold ---
          P.setAAR(tl, 1, 23, true, G(15.85));
          P.setAAR(tl, 2, 23, true, G(16.0));
          function chipPulse(el, t, rgb) {
            tl.fromTo(el, { boxShadow: "0 0 0 0px rgba(" + rgb + ",0.6)" }, { boxShadow: "0 0 0 12px rgba(" + rgb + ",0)", duration: 0.7, ease: "power2.out", immediateRender: false }, t);
          }
          [[chB, 15.85], [chC, 16.0]].forEach(function (x) {
            tl.fromTo(x[0], { backgroundColor: "#3A8DDE" }, { backgroundColor: SYS.pink, duration: 0.4, ease: "power2.inOut", immediateRender: false }, G(x[1]));
            chipPulse(x[0], G(x[1]), "230,57,155");
          });
          // hold rings: ground ellipses; C runs 0.2 s behind B so the two neighbouring rings never peak together
          // (last pulse ends B 19.05 / C 19.25, before B's release at 19.95)
          [[B, 16.5], [C, 16.7]].forEach(function (x) {
            var p = x[0];
            tl.to(p.ltC, { stroke: TERRA, duration: 0.3, ease: "power2.inOut" }, G(16.5));
            tl.to(p.ltT, { fill: TERRA, duration: 0.3, ease: "power2.inOut" }, G(16.5));
            tl.fromTo(p.ringGate, { opacity: 0 }, { opacity: 1, duration: 0.01, ease: "none" }, G(x[1]));
            tl.fromTo(p.ring, { attr: { r: 24 }, opacity: 0.7 }, { attr: { r: 42 }, opacity: 0, duration: 1.1, ease: "power2.out", repeat: 1, repeatDelay: 0.35 }, G(x[1])); // 0.7: the squashed ellipse has less ink than a circle
          });
          K.pop(tl, chipWrap, G(16.6), { dur: 0.55, ease: "back.out(1.5)" });

          // A touched down 18.26 → its chip is done: grey, "A ✓" (the check in a Sans span; a tl.set like the textContent relabels)
          function chipDone(el, letter, t) {
            tl.to(el, { backgroundColor: SYS.grey, duration: 0.3, ease: "power2.inOut" }, t);
            tl.set(el, { innerHTML: letter + '<span class="c2-ck">✓</span>' }, t);
          }
          chipDone(chA, "A", G(18.3));

          // --- VO6: the system detects, recomputes, dispatches ---
          // 「系統」: a soft mint ring on the title-bar LED marks the beat (panel already up, pill S0)
          tl.fromTo(led, { boxShadow: "0 0 0 5px rgba(159,224,201,0.45)" }, { boxShadow: "0 0 0 14px rgba(159,224,201,0)", duration: 0.5, ease: "power2.out", immediateRender: false }, G(18.76));
          tl.to(P.clock, { count: { from: 600, to: 601.43, fmt: "time" }, duration: 0.2, ease: "none" }, G(18.56)); // 10:00 → 10:01 (ticks at 18.63)
          tl.to(P.clock, { count: { from: 601.43, to: 633.93, fmt: "time" }, duration: 4.55, ease: "none" }, G(18.76)); // 10:01 → 10:34; 10:10 at 19.95, 10:20 at 21.35
          // input link: weather → panel, terra packet = constraint info
          K.reveal(tl, inlink, G(18.78), 0.2, { id: "c2-rv-in", width: 16, ease: "expo.out" });
          tl.to(pkIn, { along: { path: inlink, from: 0, to: 1, rotate: false }, duration: 0.18, ease: "none", immediateRender: true }, G(18.8));
          tl.fromTo(pkIn, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, G(18.8));
          tl.to(pkIn, { opacity: 0, duration: 0.05, ease: "none" }, G(18.98));
          K.flow(tl, inlink, G(18.98), G(23.55), 40);
          // S0 → S1 已偵測 (detect): LED turns terra (pill.set) with one ring pulse
          P.pill.set(tl, "S1", G(18.98));
          tl.fromTo(led, { boxShadow: "0 0 0 0px rgba(240,138,107,0.55)" }, { boxShadow: "0 0 0 12px rgba(240,138,107,0)", duration: 0.6, ease: "power2.out", immediateRender: false }, G(18.98));
          tl.to(led, { boxShadow: "0 0 0 5px rgba(240,138,107,0.22)", duration: 0.25, ease: "power2.out" }, G(19.58));
          // S1 → S2 計算中 (「自動」)
          P.pill.set(tl, "S2", G(19.5));
          // dispatch signal first: panel → DEP
          K.reveal(tl, sig2, G(19.58), 0.3, { id: "c2-rv-sig", width: 16, ease: "expo.out" });
          tl.to(pkSig, { along: { path: sig2, from: 0, to: 1, rotate: false }, duration: 0.26, ease: "power1.inOut", immediateRender: true }, G(19.6));
          tl.fromTo(pkSig, { opacity: 0 }, { opacity: 1, duration: 0.05, ease: "none" }, G(19.6));
          tl.to(pkSig, { opacity: 0, duration: 0.05, ease: "none" }, G(19.86));
          K.flow(tl, sig2, G(19.88), G(23.5), 40);
          // DEP receives: background terra-soft → mint, text out, then text in
          tl.fromTo(chipWrap, { backgroundColor: "#F2DDD3" }, { backgroundColor: "#E1EEE8", duration: 0.3, ease: "power2.inOut", immediateRender: false }, G(19.85));
          tl.to(chipHold, { opacity: 0, duration: 0.12, ease: "power2.in" }, G(19.84));
          tl.fromTo(chipNew, { opacity: 0, y: 6 }, { opacity: 1, y: 0, duration: 0.22, ease: "power2.out" }, G(19.95));
          [[B, 19.86], [C, 19.92]].forEach(function (x) {
            tl.to(x[0].ltC, { stroke: TEAL, duration: 0.25, ease: "power2.inOut" }, G(x[1]));
            tl.to(x[0].ltT, { fill: TEAL, duration: 0.25, ease: "power2.inOut" }, G(x[1]));
          });
          K.pop(tl, B.tt, G(19.86), { dur: 0.45, ease: "back.out(1.5)" });
          K.pop(tl, C.tt, G(19.94), { dur: 0.45, ease: "back.out(1.5)" });
          // C's tag waits left of centre (clear of B on the runway) and re-centres during C's MERGE
          tl.fromTo(C.tt, { x: 0, y: 0 }, { x: -C_TT_DX, y: -C_TT_DY, duration: 0.75, ease: "power1.inOut", immediateRender: false }, G(20.45));
          // then the CTOTs land on the timeline (after the packet has arrived, 19.86): B → 10:10, C → 10:20.
          // Both chips slide together (19.94, ±0.06 s from §0C's 19.88 / 20.00): B's destination is C's origin, so with one
          // start and one ease C's displacement is always 2× B's and the gap between them only grows (92.7 → 185 px) —
          // C is never covered. Labels follow once the gap can hold them: "B 10:10" (154 px) at 20.30 (progress 0.74, C's left
          // edge 7 px past B's new right edge), "C 10:20" at 20.42 (progress 0.97, 25 px clear). No z-order tricks needed.
          P.moveChip(tl, 1, 10, G(19.94), 0.6);
          P.moveChip(tl, 2, 20, G(19.94), 0.6);
          tl.set(chB, { textContent: "B 10:10" }, G(20.3));
          tl.set(chC, { textContent: "C 10:20" }, G(20.42));
          // S2 → S3 ✓ 已派發 (「派發」): LED back to mint with its resting glow
          P.pill.set(tl, "S3", G(20.24));
          tl.to(led, { boxShadow: LED_GLOW, duration: 0.3, ease: "power2.inOut" }, G(20.24));
          // B touched down 23.08 → its chip is done — loop closed inside VO6
          chipDone(chB, "B", G(23.12));

          // ================= AIRCRAFT =================
          // Timing keeps every release (clock) and touchdown beat: roll 0.885 s → touchdown +3.134 s.
          // On the re-fitted stage the runway roll is 96 px and the arc 1039 px, so one constant speed cannot hold both beats:
          // the roll accelerates (power2.in) to 217 px/s, the climb keeps accelerating smoothly (CustomEase, constant
          // acceleration, velocity-continuous at both ends) to 517 px/s, and the arc, approach and rollout run at 517.
          var V1 = 216.9, V2 = 517.1;
          var ACCEL = CustomEase.create("c2-accel", "M0,0 C0.3333,0.1970 0.6667,0.5304 1,1"); // p = ατ + (1−α)τ², α = 2V1/(V1+V2)
          // seg(): one `along` tween; only each plane's chronologically first tween renders immediately
          function seg(pl, path, t, dur, o, first) {
            K.fly(tl, pl, path, t, dur, { from: o.from, to: o.to, ease: o.ease || "none", alt0: o.alt0, alt1: o.alt1, squash0: o.squash0, squash1: o.squash1, immediateRender: !!first });
            return t + dur;
          }
          var LEG = {
            roll: { from: 0, to: F.LO, dur: 0.885, ease: "power2.in", alt0: 0, alt1: 0, squash0: Q, squash1: Q }, // 96 px → 217 px/s
            climb: { from: F.LO, to: F.E, dur: 0.13, ease: ACCEL, alt0: 0, alt1: 1, squash0: Q, squash1: 1 }, // 47.7 px, 217 → 517
            arc: { from: F.E, to: F.H, dur: 2.0102, alt0: 1, alt1: 1, squash0: 1, squash1: 1 }, // 1039.4 px
            app: { from: F.H, to: F.TD, dur: 0.1088, alt0: 1, alt1: 0, squash0: 1, squash1: Q }, // 56.2 px
            rollout: { from: F.TD, to: 1, dur: 0.3384, ease: "power2.out", alt0: 0, alt1: 0, squash0: Q, squash1: Q }, // 87.5 px → 0
          };
          var T_ARC0 = LEG.roll.dur + LEG.climb.dur; // roll start → arc start (1.015)
          var GROUND = { alt0: 0, alt1: 0, squash0: Q, squash1: Q };
          function legs(pl, t, list, first) {
            list.forEach(function (lg, i) { t = seg(pl, FLT2, t, lg.dur, lg, first && i === 0); });
            return t;
          }
          // Ground turn (MERGE peaks at ≈ −52°, TURN2 at +40° heading). The kit squashes in the plane's
          // local frame, which collapses the wings into a dart at steep headings, so ease the squash Q → QT → Q.
          // power1.inOut split exactly into power1.in + power1.out halves keeps position and speed continuous.
          var QT = 0.8;
          function groundTurn(pl, path, t, dur, first) {
            seg(pl, path, t, dur / 2, { from: 0, to: 0.5, ease: "power1.in", alt0: 0, alt1: 0, squash0: Q, squash1: QT }, first);
            return seg(pl, path, t + dur / 2, dur / 2, { from: 0.5, to: 1, ease: "power1.out", alt0: 0, alt1: 0, squash0: QT, squash1: Q }, false);
          }
          function turnOff(p, t) { // TURN2 (52 px) to the taxiway; the fade starts as the nose leaves the runway
            groundTurn(p.pl, TURN2, t, 0.62, false);
            tl.to(p.w, { opacity: 0, duration: 0.36, ease: "power1.out" }, t + 0.26);
          }
          var STD = [LEG.roll, LEG.climb, LEG.arc, LEG.app, LEG.rollout];

          // N1 — airborne at start (x ≈ 891 at 7.75), continues c1's landing story: approach 8.87, touchdown 8.98
          var n1From = Math.round((F.H - (1.12 * V2) / FLT2.getTotalLength()) * 10000) / 10000; // ≈ 0.4552
          var t = legs(N1.pl, G(7.75), [{ from: n1From, to: F.H, dur: 1.12, alt0: 1, alt1: 1, squash0: 1, squash1: 1 }, LEG.app, LEG.rollout], true);
          turnOff(N1, t);
          // N2 — at LU, rolls 9.90, lands 13.03 in the rain, stops at R′(0.46) short of the hatch and turns off
          t = legs(N2.pl, G(9.9), STD, true);
          turnOff(N2, t);
          // A — keeps its slot: Q1 → LU, rolls 15.13 (10:00), lifts off 16.02, lands 18.26 → chip A ✓ 18.30
          groundTurn(A.pl, MERGE, G(10.6), 0.75, true);
          t = legs(A.pl, G(15.13), STD, false);
          turnOff(A, t);
          tl.to(A.lt, { opacity: 0, duration: 0.2, ease: "power2.in" }, G(16.02));
          // B — Q2 → Q1 → LU, holds, released 19.95 (10:10), lifts off 20.84, lands 23.08 → chip B ✓ 23.12
          seg(B.pl, TAXI21, G(11.0), 0.7, Object.assign({ from: 0, to: 1, ease: "sine.inOut" }, GROUND), true);
          groundTurn(B.pl, MERGE, G(15.55), 0.75, false);
          legs(B.pl, G(19.95), STD, false);
          tl.to([B.lt, B.tt], { opacity: 0, duration: 0.2, ease: "power2.in" }, G(20.84));
          // C — Q3 → Q2 → Q1, holds, merges, released 21.35 (10:20), lifts off 22.24; mid-arc at the handoff
          seg(C.pl, TAXI32, G(11.1), 0.7, Object.assign({ from: 0, to: 1, ease: "sine.inOut" }, GROUND), true);
          seg(C.pl, TAXI21, G(15.65), 0.7, Object.assign({ from: 0, to: 1, ease: "sine.inOut" }, GROUND), false);
          groundTurn(C.pl, MERGE, G(20.45), 0.75, false);
          var cArc = G(24.3) - (G(21.35) + T_ARC0);
          legs(C.pl, G(21.35), [LEG.roll, LEG.climb, { from: F.E, to: F.E + (F.H - F.E) * (cArc / LEG.arc.dur), dur: cArc, alt0: 1, alt1: 1, squash0: 1, squash1: 1 }], false);
          tl.to([C.lt, C.tt], { opacity: 0, duration: 0.2, ease: "power2.in" }, G(22.24));

          // ================= HANDOFF → c3 =================
          // panel content (nav, columns, strip, pill) clears; the FRAME (dark box + title bar) stays for c3's identical frame
          tl.to([P.nav, P.main, P.pill.el], { opacity: 0, duration: 0.25, ease: "power2.in" }, G(23.35));
          tl.to([dep, depLabel, chipWrap, gSig], { opacity: 0, x: -40, duration: 0.45, ease: "power2.in" }, G(23.5));
          // ROUTE2's tail retracts behind C (C is ≥ 55 % along the arc from 23.50), so no stub dangles at the DEP end
          tl.fromTo(route2, { drawSVG: "0% 100%" }, { drawSVG: "55% 100%", duration: 0.45, ease: "power2.in", immediateRender: false }, G(23.5));
          // right WORLD group leaves first (≈ 0 by 24.00, before c3's ROUTE3 front reaches the DST footprint);
          // B's chip ticked at 23.12, so nothing narrative is lost
          tl.to([glow, dst, gR, lkIn, rainWrap, cloudWrap, dstLabel, uline], { opacity: 0, x: 24, duration: 0.45, ease: "power2.in" }, G(23.55));
          // c3 shows the identical frame (x 460, y 228, w 1000, h 340, bar + LED + title) on top from 23.60 and glides/morphs
          // it to x 990 / w 820 over 23.85–24.85; c2's own frame simply hides under it at 23.80
          tl.set(P.el, { opacity: 0 }, G(23.8));

          tl.set({}, {}, 16.9);
          window.__timelines["c2-airport"] = tl;
        })();
      </script>
    </template>
