          var tpe = K.ll(121.233, 25.078), nrt = K.ll(140.39, 35.77), hkg = K.ll(113.918, 22.308);

          m.world.appendChild(r1);
          var pl = K.plane({ len: 56 });
          m.world.appendChild(pl);
          K.mapPlane(m, pl);
          var tl = gsap.timeline({ paused: true });
