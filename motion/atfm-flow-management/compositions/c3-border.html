<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "ATFM Sans"; src: url("assets/fonts/NotoSansTC.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        @font-face { font-family: "ATFM Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
        #c3-root { position: absolute; inset: 0; overflow: hidden; font-family: "ATFM Sans", sans-serif; }
        #c3-root .c3-layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #c3-root #c3-zones { z-index: 0; }
        #c3-root #c3-stage { z-index: 1; }
        #c3-root #c3-ui { z-index: 3; }
        #c3-root .c3-box { position: absolute; display: block; }
        #c3-root svg.c3-svg { position: absolute; left: 0; top: 0; display: block; overflow: visible; }

        /* world: zones, boundary, labels */
        /* TintR box spans x 660–1810 so the c4 morph is a pure clip-path move (no layout tweens); visible part starts at x 980 */
        #c3-root .c3-tint-r { left: 660px; top: 228px; width: 1150px; height: 624px; background: #e1eee8; }
        #c3-root .c3-tint-l { left: 110px; top: 228px; width: 870px; height: 624px; background: #e1eee8; border-radius: 24px 0 0 24px; opacity: 0.55; }
        #c3-root .c3-bnd { left: 970px; top: 228px; width: 20px; height: 624px; }
        #c3-root .c3-lbl-l { left: 956px; top: 238px; }
        #c3-root .c3-lbl-r { left: 1004px; top: 238px; font-size: 20px; font-weight: 700; letter-spacing: 0.06em; }
        #c3-root .c3-deplbl { left: 322px; top: 806px; }

        /* slot card 通過時段 */
        #c3-root .c3-avail {
          position: absolute; right: 30px; top: 26px; height: 38px;
          display: flex; align-items: center; gap: 10px;
          font-size: 20px; font-weight: 500; color: #6e6a64; letter-spacing: 0.04em; white-space: nowrap;
        }
        #c3-root .c3-cnt { font-family: "ATFM Mono", "ATFM Sans", monospace; font-size: 26px; font-weight: 600; color: #1f6b62; }
        #c3-root .c3-letter {
          position: absolute; top: 85px; width: 64px; height: 24px; line-height: 24px; text-align: center;
          font-size: 20px; font-weight: 700; color: #6e6a64; letter-spacing: 0;
        }
        #c3-root .c3-card .k-slots { position: absolute; left: 29px; top: 111px; margin: 0; }
        #c3-root .c3-tick { position: absolute; left: 0; top: 0; overflow: visible; }

        /* ATFM panel (STORYBOARD §0.3, identical to c2) */
        #c3-root .k-row-hl { position: absolute; }
        #c3-root .k-panel-bar .k-bar-right { margin-left: 0; }
        #c3-root .c3-pills { position: relative; display: block; flex: none; width: 116px; height: 30px; margin-left: auto; }
        #c3-root .c3-pills .k-pill { position: absolute; left: 0; top: 0; width: 116px; }
        #c3-root .c3-p0 { background: #e1eee8; color: #1f6b62; }
        #c3-root .c3-p1 { background: #f2ddd3; color: #b25135; }
        #c3-root .c3-p2 { background: #fbf7f2; color: #1f6b62; box-shadow: inset 0 0 0 1.5px #a9c7bd; }
        #c3-root .c3-p3 { background: #e1eee8; color: #1f6b62; }
        #c3-root .c3-flt { color: #2f3a37; font-size: 24px; font-weight: 600; white-space: nowrap; }
        #c3-root .c3-orig { position: relative; display: inline-block; justify-self: start; font-size: 22px; color: #6e6a64; }
        #c3-root .c3-strike { position: absolute; display: block; left: -2px; right: -2px; top: 50%; height: 1.5px; margin-top: -0.75px; background: #6e6a64; }
        #c3-root .c3-arrow { font-size: 20px; font-weight: 500; color: #6e6a64; justify-self: center; }
        #c3-root .c3-newt {
          display: inline-flex; justify-self: start; opacity: 0.45;
          font-family: "ATFM Mono", "ATFM Sans", monospace; font-size: 24px; font-weight: 600; color: #1f6b62; letter-spacing: 0.02em;
        }
        #c3-root .c3-tags { position: relative; display: block; width: 120px; height: 34px; }
        #c3-root .c3-tags .k-tag { position: absolute; left: 0; top: 0; }
        #c3-root .c3-tags .c3-tag-n { background: #fbf7f2; color: #1f6b62; box-shadow: inset 0 0 0 1.5px #a9c7bd; }
      </style>
      <div id="c3-root" data-composition-id="c3-border" data-width="1920" data-height="1080" data-duration="14.1"></div>
      <script>
        (function () {
          var K = window.ATFM_KIT;
          var root = document.getElementById("c3-root");
          var tl = gsap.timeline({ paused: true });

          // ---------- constants ----------
          var W0 = 23.6; // window start on the master timeline
          function G(t) { return Math.round((t - W0) * 10000) / 10000; } // global → local
          var TEAL = "#1F6B62", TEAL2 = "#3E8C80", TSOFT = "#A9C7BD", TERRA = "#B25135", INKS = "#6E6A64", CARD = "#FBF7F2";
          var LED_MINT = "#9fe0c9", LED_GLOW = "0 0 0 4px rgba(159,224,201,0.18)";
          var PANEL_SHADOW = "0 30px 60px -30px rgba(50,40,30,0.45), 0 2px 8px rgba(60,48,36,0.06)";
          var PANEL_SHADOW0 = "0 30px 60px -30px rgba(50,40,30,0), 0 2px 8px rgba(60,48,36,0)";
          var Q = 0.55; // iso ground squash (K.AIRPORT.squash)
          var SANS = '"ATFM Sans", sans-serif', MONO = '"ATFM Mono", "ATFM Sans", monospace';

          // ---------- layers ----------
          // zones (tints, boundary, region labels) never drift: TintR stays flush with the fixed panel at 1810/228.
          // The stage breathes about the BP (980 580), so the BP / planes stay registered on the fixed boundary.
          var zones = K.el("div", { id: "c3-zones", class: "c3-layer" });
          var stage = K.el("div", { id: "c3-stage", class: "c3-layer" });
          var ui = K.el("div", { id: "c3-ui", class: "c3-layer" });
          root.appendChild(zones);
          root.appendChild(stage);
          root.appendChild(ui);

          // ===== ZONE LAYER (fixed) =====
          // 1 · zone tints (TintL under TintR)
          var tintL = K.el("div", { class: "c3-box c3-tint-l" });
          var tintR = K.el("div", { class: "c3-box c3-tint-r" });
          zones.appendChild(tintL);
          zones.appendChild(tintR);

          // 2 · boundary (+ seam light), in a wrapper that is clip-revealed top → bottom
          var bndWrap = K.el("div", { class: "c3-box c3-bnd" });
          var bndSvg = K.s("svg", { class: "c3-svg", width: "20", height: "624", viewBox: "970 228 20 624" });
          var bnd = K.s("line", { x1: "980", y1: "228", x2: "980", y2: "852", stroke: TEAL2, "stroke-width": "3", "stroke-dasharray": "10 12", opacity: "0.85" });
          var seam = K.s("line", { x1: "980", y1: "228", x2: "980", y2: "852", stroke: TEAL2, "stroke-width": "4", "stroke-dasharray": "60 900", "stroke-linecap": "round", opacity: "0" });
          bndSvg.appendChild(bnd);
          bndSvg.appendChild(seam);
          bndWrap.appendChild(bndSvg);
          zones.appendChild(bndWrap);

          // 3 · region labels
          var lblL = K.el("div", { class: "k-label is-soft c3-lbl-l", text: "鄰近飛航情報區" });
          var lblR = K.el("div", { class: "k-label c3-lbl-r", text: "臺北飛航情報區" });
          zones.appendChild(lblL);
          zones.appendChild(lblR);
          gsap.set(lblL, { xPercent: -100 });

          // ===== WORLD LAYER (breathes about 980 580) =====
          // 4 · departure airport (neighbouring FIR)
          var dep = K.el("div", { class: "c3-box", style: { left: "132px", top: "585px", width: "380px", height: "205px" } }, [K.airport({ x: 0, y: 0, w: 380 })]);
          stage.appendChild(dep);
          var depLabel = K.el("div", { class: "k-label c3-deplbl", text: "外區起飛機場" });
          stage.appendChild(depLabel);
          gsap.set(depLabel, { xPercent: -50 });

          // 5 · FX svg: route, links, BP, planes
          var fx = K.s("svg", { class: "c3-svg", width: "1920", height: "1080", viewBox: "0 0 1920 1080" });
          stage.appendChild(fx);
          var defs = K.s("defs");
          fx.appendChild(defs);
          defs.innerHTML =
            '<linearGradient id="c3-r3grad" gradientUnits="userSpaceOnUse" x1="1650" y1="0" x2="1810" y2="0">' +
            '<stop offset="0" stop-color="#1F6B62" stop-opacity="1"/><stop offset="1" stop-color="#1F6B62" stop-opacity="0"/></linearGradient>';
          function hidden(d) { var p = K.s("path", { d: d, fill: "none", stroke: "none" }); fx.appendChild(p); return p; }
          // The whole DEP group sits 8 px right of the storyboard (airport left 132) so F's 10:40 tag at Q2 keeps
          // ≥ 110 px from the canvas edge through the stage breathe and its pop overshoot.
          // R3(u) = (158.1 + 289.8u, 664.6 − 64.4u); parallel taxiway = R3(u) + (4.12, 18.56)
          // LU = R3(0.54) (314.6, 629.8). Queue spots spaced so the 76×30 time tags never overlap:
          // Q1 = taxiway(0.30) (249.16, 663.84) · Q2 = taxiway(0.02) (168.02, 681.87)
          var FLT3 = hidden("M314.6 629.8L447.9 600.2C506.5 587.2 568 580 628 580L1990 580");
          var MERGE3 = hidden("M249.16 663.84C276.5 657.8 287.27 635.86 314.6 629.8");
          var TAXI3 = hidden("M168.02 681.87L249.16 663.84");
          var L3 = FLT3.getTotalLength(); // ≈ 1680.1

          // FLT3 breakpoints. Roll / climb-end keep the storyboard distances from LU (100.95 / 194.13 px) so the
          // power2.in roll still ends at cruise speed (2·d/T ≈ V); BP / fade-out asserted ±0.002.
          var F = { LO: 100.95 / L3, CE: 194.13 / L3, BP: K.fracAt(FLT3, 980, 580), FADE: K.fracAt(FLT3, 1810, 580) };
          var REF = { BP: 0.3989, FADE: 0.8929 };
          Object.keys(REF).forEach(function (k) {
            if (Math.abs(F[k] - REF[k]) > 0.002) { if (window.console) console.warn("[c3] FLT3 frac " + k + " = " + F[k] + " (ref " + REF[k] + ")"); F[k] = REF[k]; }
          });
          var V = 260, ROLL = 0.777, CLIMB = 0.358;
          // roll start → BP crossing = ROLL + CLIMB + (BP − CE)·L/V ≈ 2.966 s (D 34.866, E 36.266)
          var RB = ROLL + CLIMB + ((F.BP - F.CE) * L3) / V;

          var route3 = K.s("path", { d: "M447.9 600.2C506.5 587.2 568 580 628 580L1810 580", fill: "none", stroke: "url(#c3-r3grad)", "stroke-width": "5", "stroke-linecap": "round" });
          fx.appendChild(route3);

          // signal links (dashed) + packets
          function link(d) { return K.s("path", { d: d, fill: "none", stroke: TEAL2, "stroke-width": "3", "stroke-dasharray": "10 12", "stroke-linecap": "round" }); }
          function packet(col) { return K.s("circle", { cx: "0", cy: "0", r: "6", fill: col, stroke: CARD, "stroke-width": "2", opacity: "0" }); }
          var gLinks = K.s("g", { class: "c3-links" });
          fx.appendChild(gLinks);
          var bpLink = link(K.smooth([[994, 568], [1120, 530], [1300, 480], [1430, 398]]));
          // starts 70 px inside the panel and leaves through its straight bottom edge (y 428 at x ≈ 1290, clear of the 22 px corner)
          var disp3 = link(K.smooth([[1320, 398], [1230, 470], [980, 488], [640, 494], [468, 520], [364, 528]]));
          gLinks.appendChild(bpLink);
          gLinks.appendChild(disp3);
          var pkBp = packet(TERRA), pkDisp = packet(TEAL2);
          gLinks.appendChild(pkBp);
          gLinks.appendChild(pkDisp);
          // crossing ring where the dispatch crosses the boundary (gated: invisible until it fires)
          var xGate = K.s("g", { transform: "translate(980 488)" });
          var xRing = K.s("circle", { r: "6", fill: "none", stroke: TEAL2, "stroke-width": "2", opacity: "0" });
          xGate.appendChild(xRing);
          gLinks.appendChild(xGate);
          var DISP_BX = K.fracAt(disp3, 980, 488); // boundary frac on DISP3 (path passes exactly through 980 488)

          // boundary point: node + terra pulse + gate capsule + check
          var bpO = K.s("g", { transform: "translate(980 580)" });
          var bp = K.node(0, 0, { r: 9 });
          var bpWarn = K.s("circle", { r: "10", fill: "none", stroke: TERRA, "stroke-width": "2", opacity: "0" });
          bp.insertBefore(bpWarn, bp.firstChild);
          var gate = K.s("rect", { x: "-3", y: "-22", width: "6", height: "44", rx: "3", fill: TERRA });
          bp.insertBefore(gate, bp.__dot); // over the cream ring, under the dot (keeps the check clean)
          // resolved state: a teal gate + teal dot pop in over the terra ones (never fill-lerp terra → teal: muddy midpoint)
          var gateOk = K.s("rect", { x: "-3", y: "-22", width: "6", height: "44", rx: "3", fill: TEAL });
          bp.insertBefore(gateOk, bp.__dot);
          var dotOk = K.s("circle", { r: "9", fill: TEAL });
          bp.appendChild(dotOk);
          var check = K.s("path", { d: "M-5 0L-1.5 3.5L5.5-3.5", fill: "none", stroke: CARD, "stroke-width": "2.2", "stroke-linecap": "round", "stroke-linejoin": "round" });
          bp.appendChild(check);
          bpO.appendChild(bp);
          fx.appendChild(bpO);

          // planes — each in a wrapper <g> (opacity / rise); the plane <g> itself is driven only by `along`
          var gP = K.s("g", { class: "c3-planes" });
          fx.appendChild(gP);
          function mkPlane(letter, time, ground) {
            var w = K.s("g", { class: "c3-pw" });
            var pl = ground ? K.plane({ len: 38, alt: 0, squash: Q }) : K.plane({ len: 38, alt: 1, squash: 1 });
            w.appendChild(pl);
            gP.appendChild(w);
            var o = { w: w, pl: pl };
            if (!letter) return o;
            o.ringGate = K.s("g", { transform: "rotate(-12.5) scale(1 " + Q + ")" }); // ring on the iso ground plane
            o.ring = K.s("circle", { r: "18", fill: "none", stroke: TERRA, "stroke-width": "2" });
            o.ringGate.appendChild(o.ring);
            pl.insertBefore(o.ringGate, pl.__body);
            o.lt = K.s("g", { transform: "translate(0 30)" });
            o.ltC = K.s("circle", { r: "15", fill: CARD, stroke: INKS, "stroke-width": "2" });
            o.ltT = K.s("text", { x: "0", y: "1", "text-anchor": "middle", "dominant-baseline": "central", fill: INKS, style: { fontFamily: SANS, fontSize: "20px", fontWeight: "700" }, text: letter });
            o.lt.appendChild(o.ltC);
            o.lt.appendChild(o.ltT);
            pl.appendChild(o.lt);
            var tto = K.s("g", { transform: "translate(0 -40)" });
            o.tt = K.s("g");
            o.tt.appendChild(K.s("rect", { x: "-34", y: "-15", width: "68", height: "30", rx: "8", fill: CARD, stroke: TSOFT, "stroke-width": "1.5" }));
            o.tt.appendChild(K.s("text", { x: "0", y: "1", "text-anchor": "middle", "dominant-baseline": "central", fill: TEAL, style: { fontFamily: MONO, fontSize: "20px", fontWeight: "600" }, text: time }));
            tto.appendChild(o.tt);
            pl.appendChild(tto);
            return o;
          }
          var T1 = mkPlane(), T2 = mkPlane();
          // queue order back → front so the plane in front draws on top
          var Fp = mkPlane("F", "10:40", true), Ep = mkPlane("E", "10:30", true), Dp = mkPlane("D", "10:20", true);
          gsap.set([Dp.ringGate, Ep.ringGate, Fp.ringGate], { opacity: 0 });

          // ===== UI LAYER (never drifts) =====
          // 1 · ATFM panel — enters as c2's identical frame at x 690
          var ROWS = [
            { f: "D", t0: "10:20", t1: "10:20", tags: [["排定", "n"], ["已起飛", "ok"]] },
            { f: "E", t0: "10:25", t1: "10:25", tags: [["排定", "n"], ["等待", "hold"], ["已派發", "ok"], ["已起飛", "ok"]] },
            { f: "F", t0: "10:30", t1: "10:30", tags: [["排定", "n"], ["等待", "hold"], ["已派發", "ok"], ["已起飛", "ok"]] },
          ];
          var R = ROWS.map(function (r) {
            var strike = K.el("span", { class: "c3-strike" });
            var orig = K.el("span", { class: "k-num c3-orig" }, [r.t0, strike]);
            var roll = K.roll(r.t1, { h: 34 });
            var nt = K.el("span", { class: "c3-newt" }, [roll]);
            var holder = K.el("span", { class: "c3-tags" });
            var tags = r.tags.map(function (x) {
              var e = K.tag(x[0], x[1] !== "hold");
              if (x[1] === "n") e.classList.add("c3-tag-n");
              holder.appendChild(e);
              return e;
            });
            return { cells: [K.el("span", { class: "c3-flt", text: "航班 " + r.f }), orig, K.el("span", { class: "c3-arrow", text: "→" }), nt, holder], strike: strike, orig: orig, nt: nt, roll: roll, tags: tags };
          });
          var panel = K.panel({ x: 690, y: 228, w: 560, title: "ATFM 流量管理系統", cols: "110px 76px 30px 92px 1fr", rows: R.map(function (r) { return r.cells; }) });
          var rows = panel.__rows;
          rows.forEach(function (row) { row.style.height = "48px"; gsap.set(row.__hl, { opacity: 0 }); });
          var bar = panel.__bar, led = bar.querySelector(".k-led");
          var pills = K.el("span", { class: "c3-pills" });
          var P = [["監控中", "c3-p0"], ["已偵測", "c3-p1"], ["計算中", "c3-p2"], ["✓ 已派發", "c3-p3"]].map(function (x) {
            var e = K.el("span", { class: "k-pill " + x[1], text: x[0] });
            pills.appendChild(e);
            return e;
          });
          var clock = K.el("span", { class: "k-bar-right", text: "09:30" });
          bar.appendChild(pills);
          bar.appendChild(clock);
          gsap.set(R.map(function (r) { return r.strike; }), { scaleX: 0, transformOrigin: "0% 50%" });
          // rolling digits: the off-window digits are clipped by design (overflow:hidden strips) — tell the audits
          function markRoll(w) {
            w.setAttribute("data-layout-allow-overflow", "");
            w.setAttribute("data-layout-allow-occlusion", "");
            Array.prototype.forEach.call(w.querySelectorAll("span"), function (e) { e.setAttribute("data-layout-allow-occlusion", ""); });
          }
          R.forEach(function (r) { markRoll(r.roll); });
          ui.appendChild(panel);

          // 2 · slot card 通過時段 (straddles the boundary, as in v4)
          var card = K.card({ x: 770, y: 300, w: 428, h: 150, title: "通過時段", cls: "c3-card" }); // 770–1198: slot row 29 px in on both sides
          var cnt = K.roll("5", { h: 34 });
          cnt.classList.add("c3-cnt");
          markRoll(cnt);
          var avail = K.el("div", { class: "c3-avail" }, [K.el("span", { text: "可用" }), cnt]);
          card.appendChild(avail);
          var letters = ["D", "E", "F"].map(function (L, i) {
            var e = K.el("div", { class: "c3-letter", text: L, style: { left: 29 + 76 * i + "px" } });
            card.appendChild(e);
            return e;
          });
          var slotRow = K.slots(["on", "on", "on", "on", "on"]);
          card.appendChild(slotRow);
          var slots = slotRow.__slots;
          var ticks = slots.map(function (s) {
            var sv = K.s("svg", { class: "c3-tick", width: "64", height: "22", viewBox: "-32 -11 64 22" });
            var p = K.s("path", { d: "M-7 0L-2 5L8-5", fill: "none", stroke: CARD, "stroke-width": "2.5", "stroke-linecap": "round", "stroke-linejoin": "round" });
            sv.appendChild(p);
            s.appendChild(sv);
            return p;
          });
          gsap.set(ticks, { drawSVG: "0% 0%" });
          ui.appendChild(card);

          // 3 · chips flanking the boundary (x 980) with equal 12 px gaps
          var chipBP = K.chip("邊境點", { x: 0, y: 624, card: true });
          chipBP.style.left = "auto";
          chipBP.style.right = (1920 - 968) + "px";
          var chipLim = K.chip("流管限制", { x: 992, y: 624, warn: true });
          ui.appendChild(chipBP);
          ui.appendChild(chipLim);
          // 4 · DEP chip
          var chipNew = K.chip("已接收新起飛時間", { x: 138, y: 490 });
          ui.appendChild(chipNew);

          // ================= TIMELINE (local times via G(global)) =================
          // --- ambient: stage breathe in (to 30.50) and back out to exactly 1.0 by 37.20 ---
          // capped at 1.015 so F's 10:40 tag at Q2 (x 160) never crosses the 110 left margin
          tl.fromTo(stage, { scale: 1, transformOrigin: "980px 580px" }, { scale: 1.015, duration: 6.9, ease: "sine.inOut" }, 0);
          tl.to(stage, { scale: 1, duration: 6.7, ease: "sine.inOut" }, 6.9);

          // --- handoff in: c2's frame → glide into the Taipei FIR zone ---
          tl.fromTo(panel, { opacity: 0 }, { opacity: 1, duration: 0.15, ease: "none" }, 0);
          // c2's identical frame still casts its shadow until it hides at 23.80; take the shadow over on that exact frame
          tl.fromTo(panel, { boxShadow: PANEL_SHADOW0 }, { boxShadow: PANEL_SHADOW, duration: 0.001, ease: "none" }, G(23.8));
          tl.fromTo(panel, { x: 0 }, { x: 560, duration: 1.0, ease: "power3.inOut" }, G(23.85));

          // --- VO7: the boundary diagram builds ---
          // two-stage draw from the DEP runway end, starting as c2's DEP has left (23.95): the front parks left of
          // x≈1150 (52 %) until c2's right group has cleared, then extends to 1810. T1/T2 fade in from 24.00, so the
          // front is always ahead of T1 (0.33 vs 0.28 at 24.00, 0.45 vs 0.29 at 24.05, 0.52 vs 0.35 at 24.30).
          tl.fromTo(route3, { drawSVG: "0% 0%" }, { drawSVG: "0% 52%", duration: 0.35, ease: "expo.out" }, G(23.95));
          tl.to(route3, { drawSVG: "0% 100%", duration: 0.6, ease: "power2.inOut" }, G(24.3));
          [T1, T2].forEach(function (p) { tl.fromTo(p.w, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, G(24.0)); });
