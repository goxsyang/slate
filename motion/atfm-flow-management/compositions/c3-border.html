<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "ATFM Sans"; src: url("assets/fonts/NotoSansTC.woff2") format("woff2"); font-weight: 100 900; font-display: block; }
        @font-face { font-family: "ATFM Mono"; src: url("assets/fonts/IBMPlexMono-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
        #c3-root { position: absolute; inset: 0; overflow: hidden; font-family: "ATFM Sans", sans-serif; }
        #c3-root .c3-layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
        #c3-root #c3-zones { z-index: 0; }
        #c3-root #c3-stage { z-index: 1; }
        #c3-root #c3-ui { z-index: 3; }
        #c3-root .c3-box { position: absolute; display: block; }
        #c3-root svg.c3-svg { position: absolute; left: 0; top: 0; display: block; overflow: visible; }

        /* world: zones, boundary, labels (type scale ×1.5 — nothing below 30 px) */
        /* TintR box spans x 660–1810 so the c4 morph is a pure clip-path move (no layout tweens); visible part starts at x 980 */
        #c3-root .c3-tint-r { left: 660px; top: 228px; width: 1150px; height: 624px; background: #e1eee8; }
        #c3-root .c3-tint-l { left: 110px; top: 228px; width: 870px; height: 624px; background: #e1eee8; border-radius: 24px 0 0 24px; opacity: 0.55; }
        #c3-root .c3-bnd { left: 970px; top: 228px; width: 20px; height: 624px; }
        /* 香港飛航情報區: soft 30, right edge 956, top of the zone, hugging the boundary from the left.
           臺北飛航情報區: 30/700 teal. §0C puts it under the panel at (1004, 586); BPLINK (BP → panel bottom) has to cross
           exactly that spot, so the caption hugs the boundary at the zone's FOOT instead (left 1004, top 804) — the
           point-symmetric twin of the Hong Kong caption. */
        #c3-root .c3-lbl-l { left: 956px; top: 238px; line-height: 44px; }
        #c3-root .c3-lbl-r {
          position: absolute; left: 1004px; top: 804px; line-height: 36px;
          font-size: 30px; font-weight: 700; color: #1f6b62; letter-spacing: 0.04em; white-space: nowrap;
        }
        /* 外區起飛機場 beside the airport (right of its apron, under ROUTE3) */
        #c3-root .c3-deplbl { left: 500px; top: 790px; line-height: 46px; }
        /* real designators (client): airway M750 above ROUTE3 left of the boundary; boundary point ENVAR under the 邊境點 chip */
        #c3-root .c3-m750 {
          position: absolute; left: 700px; top: 588px; width: 100px; height: 36px; line-height: 36px; text-align: left;
          font-family: "ATFM Mono", "ATFM Sans", monospace; font-size: 30px; font-weight: 600; color: #1f6b62; letter-spacing: 0.04em; white-space: nowrap;
        }
        #c3-root .c3-envar {
          position: absolute; left: 833px; top: 784px; width: 100px; height: 36px; line-height: 36px; text-align: center;
          font-family: "ATFM Mono", "ATFM Sans", monospace; font-size: 30px; font-weight: 600; color: #6e6a64; letter-spacing: 0.04em; white-space: nowrap;
        }
        /* strip chips: [id][ext] — ext is a clipped box (width 0) holding the CTOT / ✓ texts stacked at its left, so a
           relabel is a width + opacity tween (wipe) instead of a one-frame textContent set. Same 44 px line box for both
           spans keeps the baselines level. */
        #c3-root .c3-chip-id { display: block; flex: none; height: 44px; line-height: 44px; }
        #c3-root .c3-chip-ext { position: relative; display: block; flex: none; min-width: 0; width: 0; height: 44px; overflow: hidden; }
        #c3-root .c3-chip-txt { position: absolute; left: 0; top: 0; height: 44px; line-height: 44px; white-space: pre; opacity: 0; } /* pre: keeps the leading space (nowrap collapses it) */

      </style>
      <div id="c3-root" data-composition-id="c3-border" data-width="1920" data-height="1080" data-duration="14.1"></div>
      <script>
        (function () {
          var K = window.ATFM_KIT;
          var root = document.getElementById("c3-root");
          var tl = gsap.timeline({ paused: true });

          // ---------- constants ----------
          var W0 = 23.6; // window start on the master timeline
          function G(t) { return Math.round((t - W0) * 10000) / 10000; } // global → local
          function n1(v) { return Math.round(v * 10) / 10; }
          var TEAL = "#1F6B62", TEAL2 = "#3E8C80", TSOFT = "#A9C7BD", TERRA = "#B25135", INKS = "#6E6A64", CARD = "#FBF7F2";
          var LED_MINT = "#9fe0c9", LED_GLOW = "0 0 0 5px rgba(159,224,201,0.18)";
          var PANEL_SHADOW = "0 30px 60px -28px rgba(20,24,30,0.6), 0 2px 8px rgba(0,0,0,0.2)";
          var PANEL_SHADOW0 = "0 30px 60px -28px rgba(20,24,30,0), 0 2px 8px rgba(0,0,0,0)";
          var CHIP_GREY = "#6B7482"; // .ks-chip.is-grey
          var Q = 0.55; // iso ground squash (K.AIRPORT.squash)
          var SANS = '"ATFM Sans", sans-serif', MONO = '"ATFM Mono", "ATFM Sans", monospace';

          // ---------- geometry (§0C re-fit) ----------
          // ROUTE3 at y 660 (§0C): 92 px under the 340-px panel (y 228–568), wingtips at 642; the BP sits on it at (980, 660).
          var RY = 660, BPX = 980;
          // DEP airport w 380 (§0C). x 124 (not 110) so the ≤ 1.5 % stage breathe about the BP never pushes its left edge
          // past the 110 margin; y chosen so the RUNWAY END lands exactly on ROUTE3 (y 660) — with the storyboard's y 600
          // the route would sag 45 px right after the runway end while the plane is climbing. Box 124–504 × 644.8–850.
          var AW = 380, AX = 124, AY = RY - K.AIRPORT.runway.y1 * (AW / 1600); // 644.8
          function AP(px, py) { return K.airportPt(AX, AY, AW, px, py); }
          var RW0 = AP(K.AIRPORT.runway.x0, K.AIRPORT.runway.y0), RW1 = AP(K.AIRPORT.runway.x1, K.AIRPORT.runway.y1); // (150.1, 724.4) → (439.9, 660)
          function R3(u) { return [RW0[0] + (RW1[0] - RW0[0]) * u, RW0[1] + (RW1[1] - RW0[1]) * u]; }
          var RWL = Math.hypot(RW1[0] - RW0[0], RW1[1] - RW0[1]);
          var DIR = [(RW1[0] - RW0[0]) / RWL, (RW1[1] - RW0[1]) / RWL]; // runway heading (−12.5°)
          var TOFF = AP(K.AIRPORT.runway.x0 + 17.35, K.AIRPORT.runway.y0 + 78.15); // parallel taxiway = runway + (4.1, 18.6)
          TOFF = [TOFF[0] - RW0[0], TOFF[1] - RW0[1]];
          function TX(u) { var p = R3(u); return [p[0] + TOFF[0], p[1] + TOFF[1]]; }
          function txAtX(x) { return TX((x - RW0[0] - TOFF[0]) / (RW1[0] - RW0[0])); } // taxiway point at screen x
          // Queue: three 112×44 time tags (at −60) must not touch, so the line-up is a diagonal staircase spanning the
          // whole airport: LU = R3(0.935) (421.0, 664.2) at the runway end · Q1 = taxiway at x 300.5 (y 710.5) ·
          // Q2 = taxiway at x 180 (y 737.3). Tags: D x 365–477 / E 244.5–356.5 / F 124–236 (8.5 px gaps, staggered in y).
          var LU = R3(0.935), Q1 = txAtX(300.5), Q2 = txAtX(180);
          function P(p) { return n1(p[0]) + " " + n1(p[1]); }

          // ---------- layers ----------
          // zones (tints, boundary, region labels) never drift: TintR stays flush with the fixed panel at 1810/228.
          // The stage breathes about the BP (980 660), so the BP / planes stay registered on the fixed boundary.
          var zones = K.el("div", { id: "c3-zones", class: "c3-layer" });
          var stage = K.el("div", { id: "c3-stage", class: "c3-layer" });
          var ui = K.el("div", { id: "c3-ui", class: "c3-layer" });
          root.appendChild(zones);
          root.appendChild(stage);
          root.appendChild(ui);

          // ===== ZONE LAYER (fixed) =====
          // 1 · zone tints (TintL under TintR)
          var tintL = K.el("div", { class: "c3-box c3-tint-l" });
          var tintR = K.el("div", { class: "c3-box c3-tint-r" });
          zones.appendChild(tintL);
          zones.appendChild(tintR);

          // 2 · boundary (+ seam light), in a wrapper that is clip-revealed top → bottom
          var bndWrap = K.el("div", { class: "c3-box c3-bnd" });
          var bndSvg = K.s("svg", { class: "c3-svg", width: "20", height: "624", viewBox: "970 228 20 624" });
          var bnd = K.s("line", { x1: "980", y1: "228", x2: "980", y2: "852", stroke: TEAL2, "stroke-width": "3", "stroke-dasharray": "10 12", opacity: "0.85" });
          var seam = K.s("line", { x1: "980", y1: "228", x2: "980", y2: "852", stroke: TEAL2, "stroke-width": "4", "stroke-dasharray": "60 900", "stroke-linecap": "round", opacity: "0" });
          bndSvg.appendChild(bnd);
          bndSvg.appendChild(seam);
          bndWrap.appendChild(bndSvg);
          zones.appendChild(bndWrap);

          // 3 · region labels (real FIR names — client decision)
          var lblL = K.el("div", { class: "k-label is-soft c3-lbl-l", text: "香港飛航情報區" });
          var lblR = K.el("div", { class: "c3-lbl-r", text: "臺北飛航情報區" });
          zones.appendChild(lblL);
          zones.appendChild(lblR);
          gsap.set(lblL, { xPercent: -100 });

          // ===== WORLD LAYER (breathes about 980 660) =====
          // 4 · departure airport (Hong Kong FIR)
          var dep = K.el("div", { class: "c3-box", style: { left: AX + "px", top: AY + "px", width: AW + "px", height: Math.round(AW * K.AIRPORT.aspect) + "px" } }, [K.airport({ x: 0, y: 0, w: AW })]);
          stage.appendChild(dep);
          var depLabel = K.el("div", { class: "k-label c3-deplbl", text: "外區起飛機場" });
          stage.appendChild(depLabel);
          var m750 = K.el("div", { class: "c3-m750", text: "M750" });
          stage.appendChild(m750);

          // 5 · FX svg: route, links, BP, planes
          var fx = K.s("svg", { class: "c3-svg", width: "1920", height: "1080", viewBox: "0 0 1920 1080" });
          stage.appendChild(fx);
          var defs = K.s("defs");
          fx.appendChild(defs);
          defs.innerHTML =
            '<linearGradient id="c3-r3grad" gradientUnits="userSpaceOnUse" x1="1650" y1="0" x2="1810" y2="0">' +
            '<stop offset="0" stop-color="#1F6B62" stop-opacity="1"/><stop offset="1" stop-color="#1F6B62" stop-opacity="0"/></linearGradient>';
          function hidden(d) { var p = K.s("path", { d: d, fill: "none", stroke: "none" }); fx.appendChild(p); return p; }
          // ROUTE3 leaves the runway end on the runway heading and levels onto y 660 by x 670 (a ≤ 2 px hump), then runs to 1810.
          var C1 = [RW1[0] + DIR[0] * 20, RW1[1] + DIR[1] * 20];
          var ROUTE_TAIL = "C" + P(C1) + " 590 " + RY + " 670 " + RY;
          var FLT3 = hidden("M" + P(LU) + "L" + P(RW1) + ROUTE_TAIL + "L1990 " + RY);
          // MERGE3 (Q1 → LU) is an S-curve tangent to the runway heading at both ends; TAXI3 (Q2 → Q1) runs along the taxiway.
          var MC1 = [Q1[0] + DIR[0] * 40, Q1[1] + DIR[1] * 40], MC2 = [LU[0] - DIR[0] * 40, LU[1] - DIR[1] * 40];
          var MERGE3 = hidden("M" + P(Q1) + "C" + P(MC1) + " " + P(MC2) + " " + P(LU));
          var TAXI3 = hidden("M" + P(Q2) + "L" + P(Q1));
          var L3 = FLT3.getTotalLength(); // ≈ 1569

          // FLT3 breakpoints (asserted by geometry, not typed): BP / fade-out via K.fracAt.
          var F = { BP: K.fracAt(FLT3, BPX, RY), FADE: K.fracAt(FLT3, 1810, RY) };
          // Aircraft timing (STORYBOARD Frame 3): roll 0.777 s power2.in, climb 0.358 s, roll start → BP = 2.995 s.
          // The ×1.5 queue puts LU at the runway end (LU → BP ≈ 560 px instead of 674), so the cruise speed is
          // re-derived from the beat (V = d / (RB − ROLL/2) ≈ 215 px/s) and the roll keeps ending at cruise speed (d_roll = V·ROLL/2).
          var ROLL = 0.777, CLIMB = 0.358, RB = 2.995;
          var V = (F.BP * L3) / (RB - ROLL / 2);
          F.LO = (ROLL * V) / 2 / L3;
          F.CE = F.LO + (CLIMB * V) / L3;

          var route3 = K.s("path", { d: "M" + P(RW1) + ROUTE_TAIL + "L1810 " + RY, fill: "none", stroke: "url(#c3-r3grad)", "stroke-width": "5", "stroke-linecap": "round" });
          fx.appendChild(route3);

          // signal links (dashed) + packets
          function link(d) { return K.s("path", { d: d, fill: "none", stroke: TEAL2, "stroke-width": "3", "stroke-dasharray": "10 12", "stroke-linecap": "round" }); }
          function packet(col) { return K.s("circle", { cx: "0", cy: "0", r: "6", fill: col, stroke: CARD, "stroke-width": "2", opacity: "0" }); }
          var gLinks = K.s("g", { class: "c3-links" });
          fx.appendChild(gLinks);
          // BPLINK: BP → panel bottom edge (§0C). Leaves the node's ring at (994, 653), enters the panel's straight bottom
          // edge at x ≈ 1120 (clear of the 22 px corner) and ends 30 px above it (y 538) / 170 px inside its left edge,
          // so the ≤ 1.5 % stage breathe never exposes its end.
          var bpLink = link(K.smooth([[994, 653], [1080, 600], [1160, 538]]));
          // DISP3: panel left edge → across the boundary → the DEP chip (§0C). Starts 40 px inside the panel's left edge
          // and 30 px above its bottom, leaves through its bottom-left corner, crosses the boundary at (980, 600) — 32 px
          // under the panel, 38 px above the gate capsule — then arcs over M750 (y ≈ 553 at x 776, tag top 588) and lands
          // 60 px inside the DEP chip's right edge (x 418, y 518 = chip mid-height): the chip pops about its centre
          // (301, 518), so it covers the line's end as soon as its scale passes 0.66 — a few frames after the packet lands.
          var XING = [980, 600];
          var disp3 = link(K.smooth([[1030, 538], XING, [900, 596], [760, 548], [600, 516], [418, 518]]));
          gLinks.appendChild(bpLink);
          gLinks.appendChild(disp3);
          var pkBp = packet(TERRA), pkDisp = packet(TEAL2);
          gLinks.appendChild(pkBp);
          gLinks.appendChild(pkDisp);
          // crossing ring where the dispatch crosses the boundary (gated: invisible until it fires)
          var xGate = K.s("g", { transform: "translate(" + XING[0] + " " + XING[1] + ")" });
          var xRing = K.s("circle", { r: "6", fill: "none", stroke: TEAL2, "stroke-width": "2", opacity: "0" });
          xGate.appendChild(xRing);
          gLinks.appendChild(xGate);
          var DISP_BX = K.fracAt(disp3, XING[0], XING[1]); // boundary frac on DISP3 (path passes exactly through XING)

          // boundary point: node + terra pulse + gate capsule + check
          var bpO = K.s("g", { transform: "translate(" + BPX + " " + RY + ")" });
          var bp = K.node(0, 0, { r: 9 });
          var bpWarn = K.s("circle", { r: "10", fill: "none", stroke: TERRA, "stroke-width": "2", opacity: "0" });
          bp.insertBefore(bpWarn, bp.firstChild);
          var gate = K.s("rect", { x: "-3", y: "-22", width: "6", height: "44", rx: "3", fill: TERRA });
          bp.insertBefore(gate, bp.__dot); // over the cream ring, under the dot (keeps the check clean)
          // resolved state: a teal gate + teal dot pop in over the terra ones (never fill-lerp terra → teal: muddy midpoint)
          var gateOk = K.s("rect", { x: "-3", y: "-22", width: "6", height: "44", rx: "3", fill: TEAL });
          bp.insertBefore(gateOk, bp.__dot);
          var dotOk = K.s("circle", { r: "9", fill: TEAL });
          bp.appendChild(dotOk);
          var check = K.s("path", { d: "M-5 0L-1.5 3.5L5.5-3.5", fill: "none", stroke: CARD, "stroke-width": "2.2", "stroke-linecap": "round", "stroke-linejoin": "round" });
          bp.appendChild(check);
          bpO.appendChild(bp);
          fx.appendChild(bpO);

          // planes — each in a wrapper <g> (opacity / rise); the plane <g> itself is driven only by `along`
          var gP = K.s("g", { class: "c3-planes" });
          fx.appendChild(gP);
          function mkPlane(letter, time, ground) {
            var w = K.s("g", { class: "c3-pw" });
            var pl = ground ? K.plane({ len: 38, alt: 0, squash: Q }) : K.plane({ len: 38, alt: 1, squash: 1 });
            w.appendChild(pl);
            gP.appendChild(w);
            var o = { w: w, pl: pl };
            if (!letter) return o;
            o.ringGate = K.s("g", { transform: "rotate(-12.5) scale(1 " + Q + ")" }); // ring on the iso ground plane
            o.ring = K.s("circle", { r: "20", fill: "none", stroke: TERRA, "stroke-width": "2.5" });
            o.ringGate.appendChild(o.ring);
            pl.insertBefore(o.ringGate, pl.__body);
            // letter tag: r 23 circle, 30/700, hung 45 px under the plane (as in c2)
            o.lt = K.s("g", { transform: "translate(0 45)" });
            o.ltC = K.s("circle", { r: "23", fill: CARD, stroke: INKS, "stroke-width": "2.5" });
            o.ltT = K.s("text", { x: "0", y: "1", "text-anchor": "middle", "dominant-baseline": "central", fill: INKS, style: { fontFamily: SANS, fontSize: "30px", fontWeight: "700" }, text: letter });
            o.lt.appendChild(o.ltC);
            o.lt.appendChild(o.ltT);
            pl.appendChild(o.lt);
            // time tag: 112×44 r 12, mono 30/600, 60 px above the plane (as in c2)
            var tto = K.s("g", { transform: "translate(0 -60)" });
            o.tt = K.s("g");
            o.tt.appendChild(K.s("rect", { x: "-56", y: "-22", width: "112", height: "44", rx: "12", fill: CARD, stroke: TSOFT, "stroke-width": "2" }));
            o.tt.appendChild(K.s("text", { x: "0", y: "1", "text-anchor": "middle", "dominant-baseline": "central", fill: TEAL, style: { fontFamily: MONO, fontSize: "30px", fontWeight: "600" }, text: time }));
            tto.appendChild(o.tt);
            pl.appendChild(tto);
            return o;
          }
          var T1 = mkPlane(), T2 = mkPlane();
          // queue order back → front so the plane in front draws on top
          var Fp = mkPlane("F", "10:40", true), Ep = mkPlane("E", "10:30", true), Dp = mkPlane("D", "10:20", true);
          gsap.set([Dp.ringGate, Ep.ringGate, Fp.ringGate], { opacity: 0 });

          // ===== UI LAYER (never drifts) =====
          // 1 · the real-system panel (K.sysPanel, §0C "c3 — FIXES view"): badge ENVAR, hours 0900–1300 at 12/h,
          //     flights D 10:20 (blue, on time) · E 10:25 · F 10:30 (pink, regulated). Built at its final rect
          //     (x 990, w 820 → ruler/chips measured for 820); the FRAME enters at c2's rect (x 460, w 1000, h 340) and
          //     glides/morphs here 23.85–24.85. Content (nav, columns, strip, pill) stays hidden until 24.95.
          //     Ruler: the 10:20–10:50 half hour at 5-min ticks (16.9 px/min, as c2 zooms its own ruler). A full hour at
          //     w 820 runs 8.4 px/min, where a CTOT chip ("E 10:30" = 154 px ≈ 18 min) would sit on the next chip 10 min
          //     later and "D ✓" would reach past E's 10:30 slot. In this window D ✓ 46–128 · E 10:30 215–369 · F 10:40 383–537.
          //     The window has no :00 tick, so its end ticks are relabelled as clock times (10:20 … 10:50), the way c2's
          //     ruler reads "10:00 05 10 …": "10:20" (90 px) centred at inset 46 stays inside the ruler and clears "25" by 21 px.
          var PANEL = { x: 990, y: 228, w: 820, h: 340 };
          var PANEL0 = { x: 460, w: 1000, h: 340 }; // c2's rect (identical frame 23.60–23.85)
          var Pn = K.sysPanel({
            x: PANEL.x, y: PANEL.y, w: PANEL.w, h: PANEL.h, active: "FIXES", badge: "ENVAR", clock: "09:30",
            hours: [
              { h: "0900", aar: 12, fill: 0.85 }, { h: "1000", aar: 12, fill: 0.9 }, { h: "1100", aar: 12, fill: 0.95 },
              { h: "1200", aar: 12, fill: 0.8 }, { h: "1300", aar: 12, fill: 0.7 },
            ],
            ruler: { start: 20, minutes: 30, step: 5, label: "10" },
            flights: [{ id: "D", min: 20, tone: "blue" }, { id: "E", min: 25, tone: "pink" }, { id: "F", min: 30, tone: "pink" }],
          });
          var panel = Pn.el, led = Pn.title.firstChild;
          var chipE = Pn.chips[1].el, chipF = Pn.chips[2].el;
          var content = [Pn.nav, Pn.main, Pn.pill.el];
          gsap.set(content, { opacity: 0 });
          ui.appendChild(panel);
          [[0, "10:20"], [Pn.ticks.length - 1, "10:50"]].forEach(function (x) {
            Pn.ticks[x[0]].textContent = x[1];
            Pn.ticks[x[0]].classList.add("is-hour");
          });
          // chip relabels as motion: [id][ext] with the CTOT / ✓ texts stacked inside ext (see .c3-chip-ext). The mono
          // font advances 18 px per glyph at 30 px — space and ✓ included — so " 10:30" = 108 px and " ✓" = 36 px, and the
          // chip (padding 14 + 14) grows 46 → 154 / 46 → 82 without any layout measurement.
          var CH = 18;
          function chipExt(c, texts) {
            c.el.textContent = "";
            c.el.appendChild(K.el("span", { class: "c3-chip-id", text: c.id }));
            c.ext = K.el("span", { class: "c3-chip-ext" });
            c.txt = texts.map(function (s) {
              var e = K.el("span", { class: "c3-chip-txt", text: s });
              e.setAttribute("data-layout-allow-overlap", "");
              c.ext.appendChild(e);
              return e;
            });
            c.el.appendChild(c.ext);
            c.lab = -1;
          }
          chipExt(Pn.chips[0], [" ✓"]);
          chipExt(Pn.chips[1], [" 10:30", " ✓"]);
          chipExt(Pn.chips[2], [" 10:40"]);
          /** wipe text k into chip c's ext over dur: ext width → its text width, text k fades in (the previous one out) */
          function chipLabel(c, k, t, dur) {
            var w = c.txt[k].textContent.length * CH;
            if (c.lab < 0) tl.fromTo(c.ext, { width: 0 }, { width: w, duration: dur, ease: "power2.inOut" }, t);
            else {
              tl.to(c.ext, { width: w, duration: dur, ease: "power2.inOut" }, t);
              tl.to(c.txt[c.lab], { opacity: 0, duration: dur * 0.6, ease: "power2.in" }, t);
            }
