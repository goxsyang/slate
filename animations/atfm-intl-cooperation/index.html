<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<title>ATFM International Cooperation</title>
<style>
@font-face { font-family: 'Noto Sans TC'; font-weight: 500; src: url(fonts/NotoSansTC-500.ttf); }
@font-face { font-family: 'Noto Sans TC'; font-weight: 700; src: url(fonts/NotoSansTC-700.ttf); }
@font-face { font-family: 'Noto Sans TC'; font-weight: 900; src: url(fonts/NotoSansTC-900.ttf); }
:root {
  --sea: #c9d4cf; --land: #f3ede3; --coast: #cbc2b1; --border: #ddd4c4;
  --navy: #354e99; --green: #1f6e5c; --gold: #996a0c; --gold-line: #c2a76f;
  --card: #f7f4ef; --ink: #3f4543; --ink2: #8c908c;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #111; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--sea);
  font-family: 'Noto Sans TC', sans-serif; transform-origin: 0 0; }
#stage > svg, #stage > canvas { position: absolute; inset: 0; }
#labels { position: absolute; inset: 0; pointer-events: none; }
#labels > div { position: absolute; left: 0; top: 0; transform-origin: 0 0; white-space: nowrap; will-change: transform, opacity; }
.card { background: var(--card); border-left: 6px solid var(--navy); border-radius: 4px; padding: 9px 22px 10px 16px;
  box-shadow: 0 4px 12px rgba(40, 50, 60, .20); display: flex; align-items: center; gap: 14px; }
.card.has-glyph { height: 96px; padding: 0 22px 0 12px; }
.card .glyph { width: 72px; height: 72px; border-radius: 3px; display: grid; place-items: center; flex: none; }
.card .glyph svg { display: block; }
.card .zh { font-weight: 700; color: var(--ink); font-size: 40px; line-height: 1.12; letter-spacing: .02em; }
.card .en { font-weight: 500; color: var(--ink2); font-size: 26px; line-height: 1.2; letter-spacing: .01em; }
.big { border-radius: 8px; overflow: hidden; filter: drop-shadow(0 6px 8px rgba(40, 50, 60, .22)); transform-origin: 0 0; }
.big .band, .big .panel { border-radius: 0; }
.big .band { background: var(--c); color: #fff; font-weight: 900; font-size: 104px; line-height: 112px; height: 112px; padding: 0 28px; letter-spacing: .005em; }
.big .panel { background: var(--card); border-left: 8px solid var(--c); color: var(--c); font-weight: 700; font-size: 52px; line-height: 64px; padding: 11px 20px 11px 20px; }
.big .ln { white-space: nowrap; }
.mark { color: var(--c); font-weight: 900; font-size: 92px; line-height: 1; border-left: 5px solid var(--c); padding-left: 16px; }
#ui { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 12px; background: rgba(0,0,0,.75); color: #ddd;
  font: 13px/1.4 system-ui, sans-serif; display: flex; gap: 10px; align-items: center; }
#ui input[type=range] { flex: 1; }
body.render #ui { display: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="base" width="1920" height="1080"></canvas>
  <svg id="underSvg" width="1920" height="1080" viewBox="0 0 1920 1080"><g id="under"></g></svg>
  <canvas id="lift" width="1920" height="1080"></canvas>
  <svg id="overSvg" width="1920" height="1080" viewBox="0 0 1920 1080"><g id="over"></g></svg>
  <div id="labels"></div>
</div>
<div id="ui">
  <button id="play">▶</button>
  <input id="scrub" type="range" min="0" max="17.4174" step="0.001" value="0">
  <span id="tc">0.00</span>
</div>
<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="data/world.js"></script>
<script src="engine.js"></script>
<script src="timeline.js"></script>
</body>
</html>
